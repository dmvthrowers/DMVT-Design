<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#fffdfa;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:0;}
.cell{position:relative;overflow:hidden;aspect-ratio:4/3;border:1px solid #f0ebe0;}
.cell img{width:100%;height:100%;object-fit:cover;display:block;}
.cell-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(8,18,42,0.85));padding:16px 10px 8px;font-size:0.6rem;letter-spacing:0.12em;font-weight:700;color:#fff;text-transform:uppercase;}
.skyline-demo{background:#102040;padding:20px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;min-height:100px;}
.skyline-demo img{width:100%;opacity:0.18;display:block;}
.skyline-demo span{position:absolute;top:10px;left:12px;font-family:'Playfair Display',serif;font-weight:900;font-size:1.2rem;color:#fff;}
.dot-demo{background:#102040;padding:20px;background-image:radial-gradient(rgba(255,255,255,0.06) 1px,transparent 1px);background-size:28px 28px;min-height:80px;display:flex;align-items:center;justify-content:center;}
.dot-demo span{font-size:0.65rem;letter-spacing:0.16em;font-weight:700;text-transform:uppercase;color:rgba(255,255,255,0.5);}
</style></head>
<body>
<div class="row">
  <div class="cell">
    <img src="../assets/images/gallery/gallery-01.png" alt="Gallery 01"/>
    <span class="cell-label">Community Photo</span>
  </div>
  <div class="cell">
    <img src="../assets/images/gallery/gallery-04.png" alt="Gallery 04"/>
    <span class="cell-label">Event Candid</span>
  </div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:0;">
  <div class="skyline-demo">
    <span>HERO TITLE</span>
    <img src="../assets/images/dc-skyline.svg" alt="DC Skyline decoration"/>
    <span style="position:absolute;bottom:6px;left:12px;font-size:0.55rem;letter-spacing:0.12em;color:rgba(255,255,255,0.4);font-family:'DM Sans',sans-serif;font-weight:700;text-transform:uppercase;">DC Skyline SVG · 18% opacity · hero ornament</span>
  </div>
  <div class="dot-demo">
    <span>Dot Pattern Background · dark sections</span>
  </div>
</div>
</body></html>
