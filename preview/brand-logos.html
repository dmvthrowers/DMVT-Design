<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#fffdfa;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);}
.cell{padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;border-right:1px solid #f0ebe0;border-bottom:1px solid #f0ebe0;}
.cell:nth-child(4n){border-right:none;}
.cell img{max-width:100%;max-height:80px;object-fit:contain;}
.cell-label{font-size:0.58rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#4a5a7a;text-align:center;}
</style></head>
<body>
<div class="grid">
  <!-- On cream — logo is red, shows naturally -->
  <div class="cell" style="background:#fffdfa;">
    <img src="../assets/logos/dmvt-logo.png" alt="DMV Throwers glyph"/>
    <span class="cell-label">Primary Glyph<br/>On Cream</span>
  </div>
  <!-- On navy — invert to white -->
  <div class="cell" style="background:#102040;">
    <img src="../assets/logos/dmvt-logo.png" alt="DMV Throwers glyph on navy" style="filter:brightness(0) invert(1);"/>
    <span class="cell-label" style="color:#8fa8d8;">On Navy<br/>filter:invert</span>
  </div>
  <!-- On red — invert transparent logo to white -->
  <div class="cell" style="background:#B80000;">
    <img src="../assets/logos/dmvt-logo.png" alt="DMV Throwers glyph on red" style="filter:brightness(0) invert(1);"/>
    <span class="cell-label" style="color:rgba(255,255,255,0.75);">On Red<br/>filter:invert</span>
  </div>
  <!-- Full lockup with text -->
  <div class="cell">
    <img src="../assets/logos/dmvt-logo-with-text.jpeg" alt="Logo with text lockup" style="max-height:90px;"/>
    <span class="cell-label">With Text<br/>Lockup</span>
  </div>
  <!-- VA State logo -->
  <div class="cell">
    <img src="../assets/logos/va-state-logo.png" alt="VA State Yo-Yo Competition"/>
    <span class="cell-label">VA State<br/>Yo-Yo Contest</span>
  </div>
  <!-- VSYC-26 logo -->
  <div class="cell">
    <img src="../assets/logos/vsyc26-va-logo-512.png" alt="VSYC-26" style="max-height:80px;"/>
    <span class="cell-label">VSYC-26<br/>Event Logo</span>
  </div>
  <!-- Ko-fi donate -->
  <div class="cell">
    <img src="../assets/logos/kofi-banner.png" alt="Ko-fi donation" style="max-height:60px;"/>
    <span class="cell-label">Ko-fi<br/>Donate Banner</span>
  </div>
</div>
</body></html>
