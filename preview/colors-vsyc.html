<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Playfair+Display:wght@900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0d1428;font-family:'Montserrat',sans-serif;padding:20px 24px;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
.swatch{border:1px solid #2a3a5a;}
.swatch-body{height:64px;}
.swatch-info{padding:7px 9px;background:#0d1428;}
.swatch-name{font-size:0.65rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#c8d0e0;}
.swatch-hex{font-size:0.6rem;color:#5a6a8a;margin-top:2px;font-family:monospace;}
.demo{display:flex;gap:10px;flex-wrap:wrap;}
.demo-tag{display:inline-block;font-size:0.6rem;letter-spacing:0.2em;font-weight:800;padding:4px 12px;text-transform:uppercase;}
.demo-btn{display:inline-flex;align-items:center;min-height:36px;padding:8px 18px;font-weight:800;font-size:0.68rem;letter-spacing:0.12em;text-transform:uppercase;border:none;cursor:pointer;font-family:'Montserrat',sans-serif;}
</style></head>
<body>
<div class="grid">
  <div class="swatch"><div class="swatch-body" style="background:#C9A84C;"></div><div class="swatch-info"><div class="swatch-name">Gold</div><div class="swatch-hex">#C9A84C</div></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#e8c97a;"></div><div class="swatch-info"><div class="swatch-name">Gold Light</div><div class="swatch-hex">#e8c97a</div></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#C8102E;"></div><div class="swatch-info"><div class="swatch-name">Red</div><div class="swatch-hex">#C8102E</div></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#1a2744;"></div><div class="swatch-info"><div class="swatch-name">Navy</div><div class="swatch-hex">#1a2744</div></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#0d1428;"></div><div class="swatch-info"><div class="swatch-name">Navy Deep</div><div class="swatch-hex">#0d1428</div></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#2a3a5a;"></div><div class="swatch-info"><div class="swatch-name">Border Dark</div><div class="swatch-hex">#2a3a5a</div></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#f5f0e8;"></div><div class="swatch-info"><div class="swatch-name">Cream</div><div class="swatch-hex">#f5f0e8</div></div></div>
  <div class="swatch"><div class="swatch-body" style="background:#F9D0D4;"></div><div class="swatch-info"><div class="swatch-name">Cherry Pink</div><div class="swatch-hex">#F9D0D4</div></div></div>
</div>
<div class="demo">
  <span class="demo-tag" style="background:#C9A84C;color:#0d1428;">GOLD TAG</span>
  <span class="demo-tag" style="background:#C8102E;color:#fff;">RED TAG</span>
  <button class="demo-btn" style="background:#C9A84C;color:#0d1428;">REGISTER NOW</button>
  <button class="demo-btn" style="background:transparent;border:2px solid #C9A84C;color:#C9A84C;">LEARN MORE</button>
</div>
</body></html>
