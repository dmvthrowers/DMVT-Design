<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{padding:20px 24px;background:#fffdfa;font-family:'DM Sans',sans-serif;}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #f0ebe0;}
.row:last-child{border-bottom:none;margin-bottom:0;}
.label{font-size:0.58rem;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#4a5a7a;width:90px;flex-shrink:0;}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:10px 22px;font-weight:700;letter-spacing:0.095em;font-size:0.75rem;text-transform:uppercase;cursor:pointer;border:none;border-radius:0;font-family:'DM Sans',sans-serif;}
.dark-row{background:#102040;padding:10px;border-radius:0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
</style></head>
<body>
<div class="row">
  <span class="label">Primary</span>
  <button class="btn" style="background:#B80000;color:#fff;">SEE MEETUPS</button>
  <button class="btn" style="background:#7a0000;color:#fff;">HOVER STATE</button>
</div>
<div class="row">
  <span class="label">Secondary</span>
  <button class="btn" style="background:#102040;color:#fff;">JOIN A MEETUP</button>
  <button class="btn" style="background:#B80000;color:#fff;">HOVER STATE</button>
</div>
<div class="row">
  <span class="label">Outlines</span>
  <button class="btn" style="background:transparent;border:2px solid #B80000;color:#B80000;">OUTLINE RED</button>
  <button class="btn" style="background:transparent;border:2px solid #102040;color:#102040;">OUTLINE NAVY</button>
</div>
<div class="row" style="background:#102040;padding:10px;">
  <span class="label" style="color:#8fa8d8;">On Dark</span>
  <button class="btn" style="background:transparent;border:2px solid #fff;color:#fff;">OUTLINE WHITE</button>
  <button class="btn" style="background:#B80000;color:#fff;">FILLED RED</button>
</div>
<div class="row">
  <span class="label">VSYC-26</span>
  <button class="btn" style="background:#C9A84C;color:#0d1428;font-family:'Montserrat',sans-serif;font-weight:800;">REGISTER NOW</button>
  <button class="btn" style="background:transparent;border:2px solid #C9A84C;color:#C9A84C;font-family:'Montserrat',sans-serif;font-weight:800;">LEARN MORE</button>
</div>
<div class="row">
  <span class="label">Special</span>
  <button class="btn" style="background:#13C3A3;color:#fff;">☕ DONATE</button>
</div>
</body></html>
