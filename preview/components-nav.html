<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#f7f3ec;}
#top-bar{background:#B80000;padding:7px 24px;display:flex;justify-content:space-between;align-items:center;}
#top-bar span{font-size:0.68rem;color:#fff;letter-spacing:0.12em;font-weight:600;}
#top-bar a{font-size:0.68rem;color:#fff;letter-spacing:0.1em;font-weight:700;text-decoration:underline;}
nav{background:#fffdfa;border-bottom:1px solid #b0a890;padding:0 24px;}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:56px;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
.brand img{width:32px;height:32px;object-fit:contain;}
.brand-main{font-family:'Playfair Display',serif;font-weight:900;font-size:1rem;color:#102040;line-height:1;}
.brand-sub{font-size:0.55rem;letter-spacing:0.18em;color:#B80000;font-weight:700;margin-top:2px;text-transform:uppercase;}
.nav-links{display:flex;gap:20px;align-items:center;}
.nav-link{font-size:0.68rem;font-weight:600;letter-spacing:0.11em;text-transform:uppercase;color:#102040;text-decoration:none;padding:4px 0;border-bottom:2px solid transparent;}
.nav-link.active{color:#B80000;border-bottom-color:#B80000;}
.nav-vsyc{background:#102040;color:#fff!important;padding:6px 12px!important;border-bottom:none!important;font-size:0.65rem!important;font-weight:700!important;}
.nav-donate{background:#13C3A3;color:#fff!important;padding:6px 12px!important;border-bottom:none!important;font-size:0.65rem!important;font-weight:700!important;}
.placeholder-content{padding:28px 24px;font-size:0.8rem;color:#4a5a7a;}
</style></head>
<body>
<div id="top-bar">
  <span>NEXT MEET: MAY 18, 2026 · ARLINGTON CENTRAL LIBRARY</span>
  <a href="#">RSVP →</a>
</div>
<nav>
  <div class="nav-inner">
    <a class="brand" href="#">
      <img src="../assets/logos/dmvt-logo.png" alt="DMV Throwers"/>
      <div>
        <div class="brand-main">DMV THROWERS</div>
        <div class="brand-sub">YO-YO & SKILL TOY CLUB</div>
      </div>
    </a>
    <div class="nav-links">
      <a class="nav-link active" href="#">ABOUT</a>
      <a class="nav-link" href="#">EVENTS</a>
      <a class="nav-link" href="#">GALLERY</a>
      <a class="nav-link" href="#">RESOURCES</a>
      <a class="nav-link" href="#">FAQ</a>
      <a class="nav-link nav-donate" href="#">☕ DONATE</a>
      <a class="nav-link nav-vsyc" href="#">VSYC-26 →</a>
    </div>
  </div>
</nav>
<div class="placeholder-content">↑ Sticky cream nav with red top bar · 64px height</div>
</body></html>
