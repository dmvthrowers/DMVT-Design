<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{padding:20px 24px;background:#fffdfa;font-family:'DM Sans',sans-serif;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.card{background:#fff;border:1px solid #b0a890;padding:20px;}
.stat-num{font-family:'Playfair Display',serif;font-weight:800;font-size:2.2rem;color:#102040;line-height:1;}
.stat-label{font-size:0.72rem;letter-spacing:0.1em;color:#4a5a7a;font-weight:600;margin-top:4px;text-transform:uppercase;}
.doc-icon{font-size:1.6rem;margin-bottom:8px;}
.doc-title{font-family:'Playfair Display',serif;font-weight:700;font-size:1.05rem;color:#102040;margin-bottom:4px;}
.doc-desc{font-size:0.78rem;color:#4a5a7a;line-height:1.5;}
.div-name{font-family:'Playfair Display',serif;font-weight:900;font-size:1.3rem;color:#C9A84C;margin-bottom:4px;}
.div-desc{font-size:0.78rem;color:#c8d0e0;line-height:1.5;}
</style></head>
<body>
<div class="grid">
  <!-- Stat card: top red border -->
  <div class="card" style="border-top:3px solid #B80000;">
    <div class="stat-num">3rd</div>
    <div class="stat-label">Sunday Every Month</div>
  </div>
  <div class="card" style="border-top:3px solid #B80000;">
    <div class="stat-num">Free</div>
    <div class="stat-label">Always, No Exceptions</div>
  </div>
  <div class="card" style="border-top:3px solid #B80000;">
    <div class="stat-num">2021</div>
    <div class="stat-label">Est. DC · MD · VA</div>
  </div>
  <!-- Doc card: left navy border -->
  <div class="card" style="border-left:4px solid #102040;grid-column:span 2;">
    <div class="doc-icon">📄</div>
    <div class="doc-title">Club Constitution</div>
    <div class="doc-desc">Governing document covering membership, officers, meetings, and voting procedures for DMV Throwers.</div>
  </div>
  <!-- VSYC division card: dark bg, gold top border -->
  <div class="card" style="background:#1a2744;border:1px solid #2a3a5a;border-top:3px solid #C9A84C;">
    <div class="div-name">1A</div>
    <div class="div-desc">String Trick — Single yo-yo on a single string.</div>
    <span style="background:#2a3a5a;color:#c8d0e0;font-size:0.6rem;letter-spacing:0.1em;font-weight:700;padding:3px 8px;display:inline-block;margin-top:8px;text-transform:uppercase;">Open Division</span>
  </div>
</div>
</body></html>
